  <meta charset="UTF-8" />

  <title>AssembIe — Claude Code Skills</title>
  <link rel="stylesheet" href="src/style.css" />

</head>
<body>

<!-- ════════════════════════════════
     ⚙️  설정 — skills.json 에서 관리
     ════════════════════════════════ -->
<script>
  // 페이지 제목 / 설명만 여기서 관리합니다.
  // GitHub 계정명 · 스킬 목록은 skills.json 을 수정하세요.
  const PAGE_TITLE    = 'AssembIe';
  const PAGE_SUBTITLE = '원하는 스킬의 URL을 복사해 Claude Code에서 사용해보세요.';

  // 탭별 부제 (상단 설명 문구)
  const SUBTITLES = {
    sites:   '자주 쓰는 AI 서비스로 바로 이동하세요.',
    skill:   '원하는 스킬의 URL을 복사해 Claude Code에서 사용해보세요.',
    harness: '원하는 하네스의 URL을 복사해 Claude Code에서 사용해보세요.',
  };

  // ── AI 사이트 바로가기 목록 ──
  //   여기만 수정하면 첫 번째 탭(AI 사이트)의 아이콘이 갱신됩니다.
  //   아이콘은 각 사이트의 파비콘을 자동으로 불러옵니다.
  //   icon: 'map' | 'flow' | 'maze' | 'banana' | 'grid' 지정 시 파비콘 대신 내장 아이콘을 표시합니다.
  //   tag: 'KIST' — AI4Sci 탭의 서브탭(필터) 분류.
  const AI_SITES = [
    // ── KIST ──
    { name: 'IP Landscape',   url: 'https://iplandscape.vercel.app/',    desc: 'IP Landscape 관련 매뉴얼', icon: 'map',  tag: 'KIST' },
    { name: 'Paper-curation', url: 'https://paper-curation.jehyunlee.dev/', desc: '논문 큐레이션<br>연구 흐름 분석', icon: 'flow', tag: 'KIST' },
    { name: '미로찾기 게임',   url: 'https://tech.jehyunlee.dev/kist_miro/', desc: 'KIST 미로 · 연구를 향한 여정', icon: 'maze', tag: 'KIST' },
    { name: 'Paper-banana',   url: 'https://aix.kist.re.kr/',            desc: 'KIST AIX 플랫폼', icon: 'banana', tag: 'KIST' },
    { name: 'KIST Finder',    url: 'https://chatai.kist.re.kr:9080/',    desc: '스마트문서조회', icon: 'grid', tag: 'KIST' },
  ];

  // 내장 아이콘 (SVG) — icon 필드로 선택
  const SITE_ICONS = {
    map: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>`,
    flow: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 5c6 0 8 6 20 4"/><path d="M2 12c6 0 8-5 20-3"/><path d="M2 12c6 0 8 6 20 5"/><path d="M2 19c6 0 9-4 20-2"/></svg>`,
    maze: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M7 3v10h6"/><path d="M12 3v6"/><path d="M17 7v10"/><path d="M3 12h6"/><path d="M7 17h10"/><path d="M12 12v5"/></svg>`,
    banana: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c0 8 4 14 14 14 1.5 0 2.5-.5 2.5-1.5 0-.8-.7-1-1.5-1.2C11 14.5 7.5 9.5 7 4.5 6.9 3.6 6.5 3 5.7 3 4.7 3 4 3.8 4 5Z"/><path d="M18 16.3c1.4-1.2 2.3-2.9 2.5-4.8"/></svg>`,
    grid: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>`,
  };
</script>
<!-- ════════════════════════════════ -->

<header>
  <p class="dept">KIST AIX전략실</p>
  <div class="logo">
    <span><span style="color:#e44126">A</span>ssemb<span style="color:#e44126">I</span>e</span>
  </div>
  <p id="page-subtitle"></p>
  <div class="hero-search-wrap">
    <div class="search-wrap">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search" type="search" placeholder="키워드 검색…" autocomplete="off" />
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="sites">AI4Sci</button>
  <button class="tab" data-tab="skill">Skill</button>
  <button class="tab" data-tab="harness">Harness</button>
</div>

<div id="sub-tabs" class="sub-tabs"></div>

<div class="content-wrap">
  <div class="main-col">
    <div id="sites-grid" class="sites-grid" hidden></div>
    <div id="grid" class="grid"></div>
    <div id="state" class="state-wrap"></div>
  </div>
  <aside class="detail-panel" id="detail-panel">
    <div class="detail-empty" id="detail-empty">
      <p id="detail-hint">궁금한 스킬을 눌러보세요.</p>
    </div>
    <div id="detail-body" hidden>
      <div class="drawer-header">
        <div class="drawer-title-row">
          <span class="drawer-name" id="detail-name"></span>
          <span class="card-stars">
            <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            <span id="detail-stars"></span>
          </span>
        </div>
        <div id="detail-tags" class="card-tags"></div>
        <p class="drawer-desc" id="detail-desc"></p>
        <div class="card-actions">
          <button class="btn-copy" id="detail-copy-btn">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            URL 복사
          </button>
          <a class="btn-gh" id="detail-gh-link" href="#" target="_blank" rel="noopener">
            <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            GitHub
          </a>
        </div>
      </div>
      <div class="drawer-readme-wrap">
        <div class="drawer-readme-label">README</div>
        <div id="detail-readme" class="readme-content"></div>
      </div>
    </div>
    <div id="detail-body-site" hidden>
      <div class="drawer-header">
        <div class="drawer-title-row">
          <span class="drawer-name" id="site-detail-name"></span>
        </div>
        <div id="site-detail-tags" class="card-tags"></div>
        <p class="drawer-desc" id="site-detail-desc"></p>
        <div class="card-actions">
          <a class="btn-copy" id="site-detail-open" href="#" target="_blank" rel="noopener">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            열기
          </a>
        </div>
      </div>
    </div>
  </aside>
</div>

<footer>
  <a href="https://github.com/${GITHUB_USER}" target="_blank" rel="noopener" id="footer-link">
    Github
  </a>
  &nbsp;·&nbsp; AssembIe
</footer>

<script>
  /* ── 초기화 ── */
  document.title = PAGE_TITLE + ' — Claude Code Skills';
  document.getElementById('page-subtitle').textContent = PAGE_SUBTITLE;

  const grid   = document.getElementById('grid');
  const state  = document.getElementById('state');
  const search = document.getElementById('search');


  let GITHUB_USER = '';
  let cards        = [];
  let activePrimary = 'sites';
  let activeSubTag  = 'all';
  let selectedRepo  = null;   // 현재 상세 패널에 열려 있는 스킬
  let selectedSite  = null;   // 현재 상세 패널에 열려 있는 AI 사이트

  /* ── 정적 데이터 로드 (data.json) ──
     GitHub API를 브라우저에서 직접 호출하지 않는다 → rate limit(IP당 60회/시간) 회피.
     data.json / readme/*.md 는 GitHub Actions가 매일 미리 구워서 커밋한다. */
  async function loadSkills() {
    state.innerHTML = '<div class="spinner"></div>스킬 목록을 불러오는 중…';

    let data;
    try {
      const res = await fetch('./data.json');
      if (!res.ok) throw new Error('data.json을 불러오지 못했습니다.');
      data = await res.json();
    } catch (e) {
      state.innerHTML = `데이터를 불러오지 못했습니다. (${e.message})`;
      return;
    }

    GITHUB_USER = data.github_user;
    document.getElementById('footer-link').href = `https://github.com/${GITHUB_USER}`;

    state.innerHTML = '';
    cards = data.skills;
    updateView();
    renderSubTabs();
    applyFilters();
    resetDetail();
  }

  /* ── 복사 헬퍼 ── */
  async function copyToClipboard(url) {
    try {
      await navigator.clipboard.writeText(url);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  }

  function flashCopied(btn) {
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = `
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
      복사 완료
    `;
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1800);
  }

  /* ── 드로어 ── */
  async function fetchReadme(repo) {
    try {
      const res = await fetch(`./readme/${repo}.md`);
      if (!res.ok) return null;
      return await res.text();
    } catch {
      return null;
    }
  }

  function updateDetail(skill) {
    selectedRepo = skill.repo;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.querySelector(`.card[data-repo="${skill.repo}"]`)?.classList.add('active');

    document.getElementById('detail-name').textContent = skill.name;
    document.getElementById('detail-stars').textContent = skill.stars.toLocaleString();
    document.getElementById('detail-desc').textContent = skill.desc;

    const tagsEl = document.getElementById('detail-tags');
    if (skill.subTags.length) {
      tagsEl.innerHTML = skill.subTags.map(t => `<span class="card-tag">${t}</span>`).join('');
      tagsEl.style.display = 'flex';
    } else {
      tagsEl.innerHTML = '';
      tagsEl.style.display = 'none';
    }

    const copyBtn = document.getElementById('detail-copy-btn');
    copyBtn.onclick = async () => {
      await copyToClipboard(skill.url);
      flashCopied(copyBtn);
    };
    document.getElementById('detail-gh-link').href = skill.url;

    document.getElementById('detail-empty').hidden = true;
    document.getElementById('detail-body-site').hidden = true;
    document.getElementById('detail-body').hidden = false;

    document.getElementById('detail-body').scrollTop = 0;
    const readmeEl = document.getElementById('detail-readme');
    readmeEl.innerHTML = '<div class="readme-loading"><div class="spinner"></div><span>README 불러오는 중…</span></div>';

    fetchReadme(skill.repo).then(text => {
      readmeEl.innerHTML = text ? marked.parse(text) : '<p class="readme-empty">README를 불러올 수 없습니다.</p>';
    });
  }

  function resetDetail() {
    selectedRepo = null;
    selectedSite = null;
    document.querySelectorAll('.card, .site-tile').forEach(c => c.classList.remove('active'));
    document.getElementById('detail-empty').hidden = false;
    document.getElementById('detail-body').hidden = true;
    document.getElementById('detail-body-site').hidden = true;
    const hints = {
      sites:   '궁금한 사이트를 눌러보세요.',
      harness: '궁금한 하네스를 눌러보세요.',
      skill:   '궁금한 스킬을 눌러보세요.',
    };
    document.getElementById('detail-hint').textContent = hints[activePrimary] || hints.skill;
  }

  /* ── 카드 렌더링 ── */
  function render(list) {
    grid.innerHTML = '';

    if (list.length === 0) {
      state.innerHTML = '검색 결과가 없어요.';
      return;
    }

    state.innerHTML = '';

    list.forEach((skill) => {
      const card = document.createElement('div');
      card.className = skill.repo === selectedRepo ? 'card active' : 'card';
      card.dataset.name = (skill.name + ' ' + skill.desc).toLowerCase();
      card.dataset.repo = skill.repo;
      card.innerHTML = `
        <div class="card-top">
          <span class="card-name">${skill.name}</span>
          <span class="card-stars">
            <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            ${skill.stars.toLocaleString()}
          </span>
        </div>
        ${skill.subTags.length ? `<div class="card-tags">${skill.subTags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>` : ''}
        <div class="card-desc">${skill.desc}</div>
        <div class="card-actions">
          <button class="btn-copy">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            URL 복사
          </button>
          <a class="btn-gh" href="${skill.url}" target="_blank" rel="noopener">
            <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            GitHub
          </a>
        </div>
      `;

      card.addEventListener('click', () => updateDetail(skill));

      const copyBtn = card.querySelector('.btn-copy');
      copyBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await copyToClipboard(skill.url);
        flashCopied(copyBtn);
      });

      card.querySelector('.btn-gh').addEventListener('click', (e) => e.stopPropagation());

      grid.appendChild(card);
    });

    requestAnimationFrame(syncPanelHeight);
  }

  function syncPanelHeight() {
    const panel = document.getElementById('detail-panel');
    const mainCol = document.querySelector('.main-col');
    if (!mainCol) return;
    const pb = parseInt(getComputedStyle(mainCol).paddingBottom) || 0;
    panel.style.height = (mainCol.offsetHeight - pb) + 'px';
  }

  /* ── AI 사이트 타일 렌더링 ── */
  function faviconUrl(url) {
    return `https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(url)}`;
  }

  function renderSites() {
    const el = document.getElementById('sites-grid');
    const q = search.value.trim().toLowerCase();

    // 이름 정렬: 알파벳(영문) 먼저, 그 다음 한글 순
    const isHangul = str => /^[ㄱ-ㅎ가-힣]/.test(str);
    const nameCmp = (a, b) => {
      if (isHangul(a.name) !== isHangul(b.name)) return isHangul(a.name) ? 1 : -1;
      return a.name.localeCompare(b.name, 'ko');
    };
    // '전체'에서는 KIST 그룹을 먼저, 각 그룹 안에서 이름 순 정렬
    const tagRank = t => (t === 'KIST' ? 0 : 1);

    const list = AI_SITES
      .filter(s =>
        (activeSubTag === 'all' || s.tag === activeSubTag) &&
        (!q || (s.name + ' ' + (s.desc || '')).toLowerCase().includes(q))
      )
      .sort((a, b) => tagRank(a.tag) - tagRank(b.tag) || nameCmp(a, b));

    if (list.length === 0) {
      el.innerHTML = '';
      state.innerHTML = '검색 결과가 없어요.';
      return;
    }
    state.innerHTML = '';

    el.innerHTML = list.map(s => `
      <div class="site-tile${s.name === selectedSite ? ' active' : ''}" data-name="${s.name}">
        <span class="site-icon">
          ${s.icon && SITE_ICONS[s.icon]
            ? `<span class="site-icon-svg">${SITE_ICONS[s.icon]}</span>`
            : `<img src="${faviconUrl(s.url)}" alt="" loading="lazy"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
               <span class="site-icon-fallback" style="display:none">${s.name.charAt(0)}</span>`}
        </span>
        <span class="site-name">${s.name}</span>
        ${s.desc ? `<span class="site-desc">${s.desc}</span>` : ''}
      </div>
    `).join('');

    el.querySelectorAll('.site-tile').forEach(tile => {
      const site = list.find(s => s.name === tile.dataset.name);
      tile.addEventListener('click', () => updateSiteDetail(site));
    });

    // 열려 있던 사이트가 현재 필터 결과에서 사라졌으면 상세 패널을 닫는다.
    if (selectedSite && !list.some(s => s.name === selectedSite)) {
      resetDetail();
    }
  }

  function updateSiteDetail(site) {
    selectedSite = site.name;
    document.querySelectorAll('.site-tile').forEach(t => t.classList.remove('active'));
    document.querySelector(`.site-tile[data-name="${site.name}"]`)?.classList.add('active');

    document.getElementById('site-detail-name').textContent = site.name;
    document.getElementById('site-detail-desc').innerHTML = site.desc || '';

    const tagsEl = document.getElementById('site-detail-tags');
    if (site.tag) {
      tagsEl.innerHTML = `<span class="card-tag">${site.tag}</span>`;
      tagsEl.style.display = 'flex';
    } else {
      tagsEl.innerHTML = '';
      tagsEl.style.display = 'none';
    }

    document.getElementById('site-detail-open').href = site.url;

    document.getElementById('detail-empty').hidden = true;
    document.getElementById('detail-body').hidden = true;
    document.getElementById('detail-body-site').hidden = false;
  }

  /* ── 탭에 따라 화면 전환 ── */
  function updateView() {
    const isSites = activePrimary === 'sites';
    document.getElementById('sites-grid').hidden = !isSites;
    grid.hidden = isSites;
    document.getElementById('page-subtitle').textContent =
      SUBTITLES[activePrimary] || PAGE_SUBTITLE;
  }

  /* ── 서브탭 렌더링 ── */
  function renderSubTabs() {
    const el = document.getElementById('sub-tabs');
    const rawTags = activePrimary === 'sites'
      ? AI_SITES.map(s => s.tag).filter(Boolean)
      : cards.filter(c => c.category === activePrimary).flatMap(c => c.subTags);
    const allTags = [...new Set(rawTags)].sort((a, b) => {
      if (a === 'KIST' && b !== 'KIST') return -1;
      if (b === 'KIST' && a !== 'KIST') return 1;
      if (a.startsWith('기타') && !b.startsWith('기타')) return 1;
      if (!a.startsWith('기타') && b.startsWith('기타')) return -1;
      return a.localeCompare(b, 'ko');
    });
    if (allTags.length === 0) { el.innerHTML = ''; return; }
    el.innerHTML = ['all', ...allTags].map(tag =>
      `<button class="sub-tab${activeSubTag === tag ? ' active' : ''}" data-sub="${tag}">${tag === 'all' ? '전체' : tag}</button>`
    ).join('');
    el.querySelectorAll('.sub-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        el.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        activeSubTag = btn.dataset.sub;
        applyFilters();
      });
    });
  }

  /* ── 필터 통합 ── */
  function applyFilters() {
    if (activePrimary === 'sites') {
      renderSites();
      return;
    }
    const q = search.value.trim().toLowerCase();
    let filtered = cards.filter(c => c.category === activePrimary);
    if (activeSubTag !== 'all') {
      filtered = filtered.filter(c => c.subTags.includes(activeSubTag));
    }
    if (q) {
      filtered = filtered.filter(c =>
        (c.name + ' ' + c.desc + ' ' + c.repo).toLowerCase().includes(q)
      );
    }
    // 열려 있던 스킬이 현재 필터 결과에서 사라졌으면 상세 패널을 닫는다.
    if (selectedRepo && !filtered.some(c => c.repo === selectedRepo)) {
      resetDetail();
    }
    render(filtered);
  }

  /* ── 검색 ── */
  search.addEventListener('input', applyFilters);

  /* ── 상위 탭 ── */
  document.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      activePrimary = btn.dataset.tab;
      activeSubTag = 'all';
      updateView();
      renderSubTabs();
      applyFilters();
      resetDetail();
    });
  });

  window.addEventListener('resize', syncPanelHeight);

  /* ── 실행 ── */
  loadSkills();
</script>

</body>
</html>
