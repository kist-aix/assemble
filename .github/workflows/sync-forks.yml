name: Sync Forks with Upstream

on:
  schedule:
    - cron: '30 0 * * *'   # 매일 UTC 00:30 (KST 오전 9:30) — sync-skills 이후 실행
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync forks with upstream
        run: node scripts/sync-forks.js
        env:
          # 대상 fork 레포들에 contents:write 권한이 있는 PAT/App 토큰.
          # 저장소 Settings > Secrets and variables > Actions 에 FORK_SYNC_TOKEN 등록 필요.
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
