name: Sync Forks with Upstream

# 정기 fork 싱크는 sync-skills 워크플로우 파이프라인에 포함되어 있음.
# 이 워크플로우는 fork만 즉시 수동으로 싱크하고 싶을 때 쓰는 온디맨드 버튼.
on:
  workflow_dispatch:

jobs:
  sync-forks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync forks with upstream
        run: node scripts/sync-forks.js
        env:
          # 대상 fork 레포들에 contents:write 권한이 있는 PAT/App 토큰.
          # 저장소 Settings > Secrets and variables > Actions 에 FORK_SYNC_TOKEN 등록 필요.
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
